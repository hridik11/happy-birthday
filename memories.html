<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-stage="6">

  <!-- PAGE 6 of 10 — MEMORIES
       You do NOT edit this file to add memories.
       Open  js/memories.js  — each memory (photo, date, title, text) is listed there.
       Photos go in the  images  folder as memory1.jpg, memory2.jpg, memory3.jpg ... -->
  <div class="page" style="justify-content:flex-start">
    <h1 class="script rise" style="--d:.2s">Our little memories 📸</h1>
    <p class="lead rise" style="--d:.6s">A few moments I'll keep forever.</p>

    <div class="mem-grid" id="grid"></div>

    <a class="btn rise" style="--d:1.2s" data-go href="bear.html">Someone wants to say hi →</a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/memories.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Builds one card for every memory listed in js/memories.js
    (function () {
      var grid = document.getElementById('grid');
      (window.MEMORIES || []).forEach(function (m, i) {
        var card = document.createElement('article');
        card.className = 'mem';
        card.style.setProperty('--d', (0.6 + i * 0.15) + 's');
        if (m.photo) {
          var img = document.createElement('img');
          img.setAttribute('data-photo', m.photo);
          img.alt = m.title || 'Memory';
          card.appendChild(img);
        }
        if (m.date)  { var d = document.createElement('div'); d.className = 'date'; d.textContent = m.date; card.appendChild(d); }
        if (m.title) { var h = document.createElement('h3'); h.textContent = m.title; card.appendChild(h); }
        if (m.text)  { var p = document.createElement('p'); p.textContent = m.text; card.appendChild(p); }
        grid.appendChild(card);
      });
      loadPhotos(grid);
    })();
  </script>
</body>
</html>
